# 1. Cổng chạy Web API (khi gọi Postman sẽ gọi vào localhost:8080)
server.port=8080

# 2. Cổng 1433 của SQL Server phải đặt sau dấu hai chấm (:1433) ở dòng này
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TradingDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# 3. JWT secret (tối thiểu 32 ký tự) - đặt qua biến môi trường JWT_SECRET
jwt.secret=${JWT_SECRET:}

# 4. Nạp cấu hình bí mật trên máy cá nhân (file này KHÔNG được đưa lên Git)
spring.config.import=optional:classpath:application-local.properties
